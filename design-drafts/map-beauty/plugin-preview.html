<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Status Atelier · 插件内地图打开原型</title>
  <link rel="icon" href="data:,">
  <style>
    :root { font-family: "Microsoft YaHei", system-ui, sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; background: #202724; }
    body { overflow: hidden; }
    .plugin-stage { position: fixed; inset: 0; }
    .plugin-frame, .map-frame { display: block; width: 100%; height: 100%; border: 0; background: #202724; }
    .loading-note {
      position: fixed;
      z-index: 2;
      left: 50%;
      top: 18px;
      max-width: calc(100% - 32px);
      padding: 10px 14px;
      border: 1px solid rgba(231, 211, 173, .45);
      color: #f2e6cf;
      background: #27231d;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
      font-size: .82rem;
      line-height: 1.45;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .loading-note[hidden] { display: none; }
    .map-overlay {
      position: fixed;
      z-index: 20;
      inset: 0;
      background: #11110f;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(18px);
      transition: opacity 180ms ease, transform 240ms cubic-bezier(.2,.75,.25,1), visibility 0s linear 240ms;
    }
    .map-overlay.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
      transition-delay: 0s;
    }
    @media (prefers-reduced-motion: reduce) {
      .map-overlay { transition: none; }
    }
  </style>
</head>
<body>
  <main class="plugin-stage" aria-label="Status Atelier 插件任务地图打开原型">
    <p class="loading-note" id="loading-note" role="status">正在打开插件的“状态栏库 → 任务地图”界面……</p>
    <iframe
      class="plugin-frame"
      id="plugin-frame"
      title="Status Atelier 插件界面"
      src="/status-atelier-current-preview.html?workspace=status"
    ></iframe>

    <section class="map-overlay" id="map-overlay" aria-label="复古任务地图" aria-hidden="true">
      <iframe
        class="map-frame"
        id="map-frame"
        title="复古旅行档案地图"
        src="./index.html?embedded=1"
        tabindex="-1"
      ></iframe>
    </section>
  </main>

  <script>
    const pluginFrame = document.querySelector('#plugin-frame');
    const mapFrame = document.querySelector('#map-frame');
    const overlay = document.querySelector('#map-overlay');
    const loadingNote = document.querySelector('#loading-note');
    let lastTrigger = null;

    function openMap(trigger) {
      lastTrigger = trigger || pluginFrame;
      overlay.classList.add('is-open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.classList.add('map-is-open');
      if (!history.state?.statusAtelierMap) history.pushState({ statusAtelierMap: true }, '', '#map');
      mapFrame.focus();
    }

    function closeMap({ useHistory = true } = {}) {
      if (!overlay.classList.contains('is-open')) return;
      overlay.classList.remove('is-open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('map-is-open');
      lastTrigger?.focus?.();
      if (useHistory && history.state?.statusAtelierMap) history.back();
    }

    function attachMapEntry() {
      const pluginDocument = pluginFrame.contentDocument;
      if (!pluginDocument) return false;

      const structureSelect = pluginDocument.querySelector('#status-atelier-structure');
      if (!structureSelect) return false;
      if (structureSelect && structureSelect.value !== 'quest') {
        structureSelect.value = 'quest';
        structureSelect.dispatchEvent(new Event('change', { bubbles: true }));
      }

      const preview = pluginDocument.querySelector('#status-atelier-preview');
      if (!preview) return false;
      const questCard = preview.querySelector('.zeya-regex-status[data-structure="quest"]');
      questCard?.classList.add('map-beauty-quest-preview');
      const mapArt = questCard?.querySelector('.zrs-structure-art');
      if (mapArt && !mapArt.querySelector('.map-beauty-polaroid')) {
        mapArt.insertAdjacentHTML('beforeend', `
          <span class="map-beauty-thread thread-a" aria-hidden="true"></span>
          <span class="map-beauty-thread thread-b" aria-hidden="true"></span>
          <span class="map-beauty-polaroid photo-a" aria-hidden="true"><b></b><em>雾岭</em></span>
          <span class="map-beauty-polaroid photo-b" aria-hidden="true"><b></b><em>古驿</em></span>
          <span class="map-beauty-polaroid photo-c" aria-hidden="true"><b></b><em>北境</em></span>
          <span class="map-beauty-compass" aria-hidden="true"><i></i></span>
        `);
      }
      const nodes = preview.querySelectorAll('.zrs-map-node');
      nodes.forEach(node => {
        if (node.dataset.mapBeautyBound === 'true') return;
        node.dataset.mapBeautyBound = 'true';
        node.setAttribute('aria-label', `${node.textContent.trim()}，打开地图画面`);
        node.title = '打开复古任务地图';
        node.addEventListener('click', () => openMap(node));
      });

      if (!preview.querySelector('.map-beauty-entry-help')) {
        const help = pluginDocument.createElement('p');
        help.className = 'map-beauty-entry-help';
        help.textContent = '点击上方任一地图节点，打开完整地图画面';
        if (!pluginDocument.querySelector('#map-beauty-entry-style')) {
          const style = pluginDocument.createElement('style');
          style.id = 'map-beauty-entry-style';
          style.textContent = `
            .map-beauty-quest-preview {
              --z-accent:#8b392a!important;
              --z-bg:#b19a74!important;
              --z-card:#e2d6bc!important;
              --z-text:#342e26!important;
              --z-muted:#756650!important;
            }
            .map-beauty-quest-preview .zrs-card {
              padding:9px!important;
              overflow:visible!important;
              border:0!important;
              border-radius:2px!important;
              background:repeating-linear-gradient(0deg,rgba(72,55,38,.12) 0 1px,transparent 1px 24px),#74624d!important;
              box-shadow:0 18px 38px rgba(25,18,12,.35)!important;
              clip-path:polygon(0 1%,7% 0,15% 1%,24% 0,34% 1%,44% 0,55% 1%,66% 0,77% 1%,88% 0,100% 1%,99% 99%,89% 100%,76% 99%,63% 100%,49% 99%,35% 100%,21% 99%,8% 100%,0 99%)!important;
            }
            .map-beauty-quest-preview .zrs-chrome {
              color:#eadfc8!important;
              background:#332a22!important;
            }
            .map-beauty-quest-preview .zrs-header {
              margin:0 5px!important;
              padding:17px 18px 13px!important;
              border:0!important;
              color:#342e26!important;
              background:repeating-radial-gradient(circle at 0 0,rgba(75,56,37,.05) 0 1px,transparent 1px 5px),#dfd2b7!important;
              clip-path:polygon(0 4%,8% 0,19% 3%,30% 0,43% 3%,57% 0,71% 3%,84% 0,100% 4%,99% 100%,0 98%)!important;
            }
            .map-beauty-quest-preview .zrs-title { font-family:"Noto Serif SC","Songti SC",serif!important;letter-spacing:.12em!important; }
            .map-beauty-quest-preview .zrs-subtitle { color:#7a3327!important;letter-spacing:.22em!important; }
            .map-beauty-quest-preview .zrs-content {
              margin:0 5px!important;
              padding:10px 12px 18px!important;
              background:linear-gradient(90deg,transparent 49.5%,rgba(79,60,39,.12) 50%,transparent 50.5%),#dfd2b7!important;
            }
            .map-beauty-quest-preview .zrs-structure-art {
              position:relative!important;
              display:block!important;
              height:270px!important;
              margin:0 0 12px!important;
              overflow:visible!important;
              border:1px solid rgba(73,56,38,.22)!important;
              background:
                repeating-radial-gradient(ellipse at 40% 55%,transparent 0 8px,rgba(90,74,52,.11) 9px 10px,transparent 11px 17px),
                linear-gradient(155deg,transparent 0 61%,rgba(70,82,69,.13) 62% 78%,transparent 79%),
                #d8cbae!important;
              box-shadow:inset 0 0 24px rgba(89,58,31,.15)!important;
              clip-path:polygon(0 2%,6% 0,14% 2%,23% 0,34% 2%,45% 0,57% 2%,68% 0,80% 2%,91% 0,100% 2%,99% 98%,88% 100%,76% 98%,64% 100%,51% 98%,38% 100%,25% 98%,12% 100%,0 98%)!important;
            }
            .map-beauty-quest-preview .zrs-structure-art>i { display:none!important; }
            .map-beauty-quest-preview .zrs-structure-art::before {
              content:"FIELD ARCHIVE  /  SCALE 1:250,000"!important;
              position:absolute!important;
              left:16px!important;
              top:18px!important;
              color:#6a5947!important;
              font:800 7px/1 monospace!important;
              letter-spacing:.13em!important;
            }
            .map-beauty-quest-preview .zrs-structure-art::after {
              content:""!important;
              position:absolute!important;
              inset:0!important;
              pointer-events:none!important;
              background:linear-gradient(140deg,transparent 0 22%,rgba(67,76,65,.12) 22.5% 23%,transparent 23.5% 47%,rgba(67,76,65,.1) 47.5% 48%,transparent 48.5%)!important;
            }
            .map-beauty-quest-preview .zrs-map-node {
              z-index:6!important;
              min-width:84px!important;
              min-height:48px!important;
              padding:25px 7px 3px!important;
              border:0!important;
              border-radius:0!important;
              color:#382f27!important;
              background:transparent!important;
              box-shadow:none!important;
              font:800 10px/1.15 "Noto Serif SC","Songti SC",serif!important;
              text-align:center!important;
            }
            .map-beauty-quest-preview .zrs-map-node::before {
              content:"";
              position:absolute;
              left:50%;
              top:5px;
              width:16px;
              height:16px;
              border:3px solid #eee0c0;
              border-radius:50%;
              background:#8b392a;
              box-shadow:0 0 0 3px rgba(139,57,42,.18),0 2px 3px rgba(50,25,16,.35);
              transform:translateX(-50%);
            }
            .map-beauty-quest-preview .zrs-map-node:nth-of-type(1) { left:17%!important;bottom:42px!important;top:auto!important; }
            .map-beauty-quest-preview .zrs-map-node:nth-of-type(2) { left:43%!important;top:83px!important; }
            .map-beauty-quest-preview .zrs-map-node:nth-of-type(3) { right:13%!important;bottom:57px!important;top:auto!important; }
            .map-beauty-quest-preview .zrs-map-node.is-active { color:#7a3028!important;transform:translateY(-2px)!important; }
            .map-beauty-quest-preview .zrs-map-node.is-active::before { background:#552219;box-shadow:0 0 0 6px rgba(139,57,42,.22); }
            .map-beauty-thread { position:absolute;z-index:3;height:2px;background:#8b392a;box-shadow:0 1px 2px rgba(64,25,17,.28);transform-origin:left center; }
            .map-beauty-thread.thread-a { left:25%;top:69%;width:29%;transform:rotate(-27deg); }
            .map-beauty-thread.thread-b { left:53%;top:43%;width:30%;transform:rotate(28deg); }
            .map-beauty-polaroid { position:absolute;z-index:5;display:block;width:82px;padding:6px 6px 14px;color:#40362c;background:#e2dac8;box-shadow:0 5px 9px rgba(37,24,15,.28); }
            .map-beauty-polaroid b { display:block;height:47px;border:1px solid rgba(50,43,35,.22);background:linear-gradient(145deg,transparent 0 44%,#5b5e58 45% 59%,transparent 60%),linear-gradient(#c7c3b6,#858880);filter:grayscale(1) sepia(.25); }
            .map-beauty-polaroid em { display:block;margin-top:5px;font:italic 700 9px/1 "KaiTi",serif;text-align:center; }
            .map-beauty-polaroid.photo-a { left:-7px;top:35px;transform:rotate(-5deg); }
            .map-beauty-polaroid.photo-b { right:-5px;top:22px;transform:rotate(4deg); }
            .map-beauty-polaroid.photo-c { right:3px;bottom:-13px;width:74px;transform:rotate(-3deg); }
            .map-beauty-polaroid::before { content:"";position:absolute;left:50%;top:-6px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#f6f0df,#a69b87 65%,#6f6558);box-shadow:0 2px 3px rgba(0,0,0,.32);transform:translateX(-50%); }
            .map-beauty-compass { position:absolute;z-index:2;right:84px;bottom:14px;width:42px;height:42px;border:1px solid #665846;border-radius:50%; }
            .map-beauty-compass::before,.map-beauty-compass::after { content:"";position:absolute;left:50%;top:4px;width:1px;height:34px;background:#665846;transform-origin:center; }
            .map-beauty-compass::after { transform:rotate(90deg); }
            .map-beauty-compass i { position:absolute;left:15px;top:6px;width:11px;height:28px;border:1px solid #665846;transform:rotate(24deg); }
            .map-beauty-entry-help { margin:4px 5px 11px!important;padding:9px 12px!important;border:1px dashed #8b392a!important;color:#7b3327!important;background:rgba(230,217,190,.65)!important;font-weight:800!important;font-size:12px!important;text-align:center!important; }
            .map-beauty-quest-preview .zrs-fields { gap:0!important;padding:10px 8px 14px!important;background:repeating-linear-gradient(0deg,transparent 0 25px,rgba(78,60,40,.08) 26px),#dfd2b7!important; }
            .map-beauty-quest-preview .zrs-field { margin:0!important;padding:10px 9px!important;border:0!important;border-bottom:1px dashed rgba(82,63,43,.3)!important;background:transparent!important;box-shadow:none!important; }
            .map-beauty-quest-preview .zrs-field::before { color:#8b392a!important; }
            .map-beauty-quest-preview .zrs-meter { border-radius:0!important;background:rgba(78,60,40,.14)!important; }
            .map-beauty-quest-preview .zrs-meter>i { border-radius:0!important;background:#8b392a!important; }
            .zrs-map-node { cursor:pointer; }
            .zrs-map-node:focus-visible { outline:3px solid #ffe29a;outline-offset:3px; }
            @media(max-width:520px) {
              .map-beauty-quest-preview .zrs-structure-art { height:246px!important; }
              .map-beauty-polaroid { width:68px; }
              .map-beauty-polaroid b { height:38px; }
              .map-beauty-quest-preview .zrs-map-node:nth-of-type(1) { left:13%!important; }
              .map-beauty-quest-preview .zrs-map-node:nth-of-type(3) { right:9%!important; }
            }
          `;
          pluginDocument.head.append(style);
        }
        preview.querySelector('.zrs-structure-art')?.after(help);
      }

      if (nodes.length) loadingNote.hidden = true;
      return nodes.length > 0;
    }

    pluginFrame.addEventListener('load', () => {
      attachMapEntry();
      const pluginDocument = pluginFrame.contentDocument;
      const preview = pluginDocument?.querySelector('#status-atelier-preview');
      if (preview) new MutationObserver(attachMapEntry).observe(preview, { childList: true, subtree: true });
    });

    const integrationTimer = window.setInterval(() => {
      if (attachMapEntry()) window.clearInterval(integrationTimer);
    }, 120);
    window.setTimeout(() => window.clearInterval(integrationTimer), 10000);

    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.data?.type !== 'status-atelier-map-close') return;
      closeMap();
    });

    window.addEventListener('popstate', () => closeMap({ useHistory: false }));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && overlay.classList.contains('is-open')) closeMap();
    });
  </script>
</body>
</html>
