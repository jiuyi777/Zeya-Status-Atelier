<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同行手记 · 人物状态栏</title><link rel="stylesheet" href="characters.css?v=chibi2"></head><body><main>
<header class="page-head"><div><span class="eyebrow">PEOPLE IN YOUR STORY · 03</span><h1>把同行的人，装进口袋。</h1><p>戳一下小人，听听此刻的心声。左右滑动，遇见下一位。</p></div></header>
<section id="character-card" class="character-card" aria-label="人物状态栏"><header class="card-head"><span>✳ 同行手记</span><span id="scene-time">初夏 · 16:20</span><span id="page-number">01 / 03</span></header>
<div class="character-body" id="swipe-area"><div class="portrait-side"><div class="portrait-frame"><button id="portrait-button" class="portrait-button" aria-label="点击人物，听听心声"><span id="portrait-art" class="portrait-art"></span></button><div id="speech-bubble" class="speech-bubble" hidden role="status"><small id="speech-label">轻声说</small><p id="speech-text"></p><button id="close-speech" aria-label="关闭气泡">×</button></div><span class="vertical-caption">LITTLE FRIENDS · BIG STORIES</span><span class="portrait-tap">♡ 戳戳小人 · 听听心声</span><div class="upload-controls"><button id="change-image">＋ 更换图片</button><button id="reset-image" hidden>恢复样板</button></div><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div><p id="image-status" class="image-status" role="status">样板立绘 · 每个人都可以换成自己的图片</p></div>
<div class="character-details"><div class="identity"><span id="character-role" class="role-tag"></span><span id="character-symbol" class="identity-symbol"></span><h2 id="character-name"></h2><p id="character-subtitle"></p></div><div class="where-row"><span>⌖ <span id="character-location"></span></span><span id="character-mood" class="mood"></span></div><div class="relationship"><div><span id="relationship-label"></span><span id="relationship-value"></span></div><div id="relationship-meter" class="meter" role="progressbar" aria-label="关系值" aria-valuemin="0" aria-valuemax="100"><i id="relationship-fill"></i></div><p id="relationship-note"></p></div><dl class="state-fields"><div><dt>正在做什么</dt><dd id="character-action"></dd></div><div><dt>今日衣着</dt><dd id="character-outfit"></dd></div></dl><article class="thought-card"><span class="tape"></span><small>没有说出口的话</small><p id="character-thought"></p></article><div class="next-plan"><span>接下来</span><p id="character-plan"></p></div></div></div>
<footer class="character-navigation"><button id="previous" class="arrow" aria-label="上一位人物">←</button><div id="character-tabs" class="character-tabs" role="group" aria-label="直接选择人物"></div><button id="next" class="arrow" aria-label="下一位人物">→</button></footer><div id="page-dots" class="page-dots" aria-label="人物分页"></div>
</section><footer class="page-foot"><span>九一 · Q 版人物状态栏样本</span><span>示例人物与状态 · 上传图片保存在当前浏览器</span></footer><div id="toast" class="toast" role="status"></div>
</main><script src="characters.js?v=chibi2"></script></body></html>
