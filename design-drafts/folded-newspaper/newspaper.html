<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>此刻日报 · 折页状态栏</title><link rel="stylesheet" href="newspaper.css"></head><body>
<main><header class="intro"><div><small>STATUS EXPERIMENT / 03</small><h1>把此刻，折成一份报纸。</h1><p>点封面摊开小报，点栏目读批注。故事里的消息，都在这里。</p></div><a href="../chibi-characters/characters.html">上一款 ↗</a></header>
<div class="edition-controls" role="group" aria-label="切换示例报道"><span>试读一期</span><button data-edition="0" aria-pressed="true">午后 · 书店</button><button data-edition="1" aria-pressed="false">夜间 · 车站</button></div>
<article class="newspaper" id="paper"><div class="paper-top"><span>九一报业 · 故事特刊</span><span id="issue"></span><span>每一刻都值得记下</span></div><header class="masthead"><span class="seal">此刻<br>存档</span><div><h2>此刻日报</h2><p>THE MOMENT GAZETTE</p></div><button id="fold-button" aria-expanded="false" aria-controls="inside">摊开报纸 ↗</button></header>
<div class="ticker"><span id="time"></span><span id="location"></span><span id="weather"></span></div>
<button class="cover" id="cover-button" aria-expanded="false" aria-controls="inside"><div class="headline"><small>头版 / 人物近况</small><h3 id="headline"></h3><p id="summary"></p><span id="fold-hint">沿折线打开 · 还有 5 则近况 ↓</span></div><div class="cover-art"><div id="portrait" class="portrait"></div><span id="caption"></span></div></button>
<div class="quick-status"><span>精神 <b id="energy"></b></span><span>心情 <b id="mood"></b></span><span>关系 <b id="relation"></b></span></div>
<div class="crease"><span>✂</span><span>FOLD HERE · 沿此折叠</span></div>
<div class="inside" id="inside" inert><div class="inside-clip"><div class="columns">
<section class="column"><div class="column-heading">人物专访 <span>01</span></div><button class="story-card" data-story="thought"><small>心声 / 点击读批注</small><h4 id="thought-title"></h4><p id="thought"></p><span class="read-more">听听没说出口的话 ↗</span></button><div class="lined-status"><h4>今日衣着</h4><p id="outfit"></p><h4>当前行动</h4><p id="action"></p></div></section>
<section class="column"><div class="column-heading">同行关系 <span>02</span></div><button class="relationship-card story-card" data-story="relationship"><div class="relation-number"><span id="relation-number"></span><small>/ 100</small></div><h4 id="relation-title"></h4><p id="relation-note"></p><span class="read-more">查看相处细节 ↗</span></button><div class="notice"><small>下期预告</small><h4 id="plan"></h4><button id="plan-draft">将约定写入草稿 →</button></div></section>
<section class="column"><div class="column-heading">口袋分类广告 <span>03</span></div><div id="classifieds"></div><div class="weather-stamp"><span id="weather-icon"></span><div><small>本报生活提示</small><p id="tip"></p></div></div></section>
</div><section class="annotation" id="annotation" hidden aria-live="polite"><div><small>编辑手写批注</small><button id="close-annotation" aria-label="收起批注">×</button></div><h4 id="annotation-title"></h4><p id="annotation-text"></p><button id="annotation-action">写入行动草稿 ↗</button></section><section class="composer"><label for="draft">读者来信 <small>你的下一步行动</small></label><textarea id="draft" rows="2" placeholder="从报道中选择行动，或写下你想说的话……"></textarea><div><span id="draft-status" role="status">只填入草稿，不会自动发送</span><button id="copy">复制来信</button></div></section></div></div>
<footer class="paper-footer"><span>本报消息来自故事此刻</span><button id="bookmark" aria-pressed="false">☆ 收藏这一期</button><span id="page-count">01 / 01</span></footer></article>
<footer class="page-footer"><span>九一 · 折页报纸状态栏样本</span><span>两期均为演示数据 · 尚未连接 AI</span></footer></main><script src="newspaper.js"></script></body></html>
