<header class="toolbar"><div><h1>四时小物</h1><small>四种小物件，四个故事入口 · 九一</small></div><div><a href="./opening-keepsake-overview.html" style="color:inherit;font-size:12px;margin-right:16px">四款总览</a><button id="toggle-editor">展开编辑</button></div></header><nav class="theme-tabs" aria-label="选择开场白模板"><button data-theme="cloth-book"><span>01</span>风藏书页<small>布面小书</small></button><button data-theme="mixtape"><span>02</span>留声片刻<small>旧磁带</small></button><button data-theme="folded-map"><span>03</span>沿途拾光<small>折叠地图</small></button><button data-theme="vellum-page"><span>04</span>一页晴天<small>描图纸</small></button></nav><div class="workspace"><aside id="editor" hidden><h2>作品设置</h2><p class="note">配图可留空。无图时采用完整的文字排版，不显示空框。</p><label for="title">作品名称</label><input id="title"><div class="row"><div><label for="subtitle">英文副标题</label><input id="subtitle"></div><div><label for="author">作者</label><input id="author"></div></div><label for="imageUrl">作品配图链接（可留空）</label><input id="imageUrl" type="url"><button type="button" id="upload-cover">选择作品配图</button><label for="intro">作品简介</label><textarea id="intro"></textarea><button type="button" id="insert-intro">在简介光标处插图</button>
<details open><summary>开场白内容</summary><label for="entry">选择开场白</label><select id="entry"></select><label for="entry-title">标题</label><input id="entry-title"><label for="entry-summary">目录简介</label><textarea id="entry-summary"></textarea><label for="entry-imageUrl">本条配图链接（可留空）</label><input id="entry-imageUrl" type="url" placeholder="https://…"><button type="button" id="upload-entry-cover">选择本条配图</button><label for="entry-body">开场白正文</label><textarea id="entry-body" rows="6"></textarea><button type="button" id="insert-body">在正文光标处插图</button><p class="note">可插入多张图片。光标放在想插图的段落，点击按钮选图；图片可随文字剪切、移动。</p><div class="row"><button id="add">添加开场白</button><button id="remove">移除本条</button></div><div class="row"><button id="up">向前移动</button><button id="read">预览本条</button></div></details>
<details><summary>字体、配色与字号</summary><div class="row"><div><label for="accent">点缀色</label><input type="color" id="accent"></div><div><label for="ink">文字主色</label><input type="color" id="ink"></div></div><label for="fontStyle">页面字体（标题与正文）</label><select id="fontStyle"><option value="serif">清雅宋体</option><option value="kai">温润楷体</option><option value="sans">清晰黑体</option><option value="fangsong">雅致仿宋</option><option value="rounded">柔和圆体</option><option value="clerical">古典隶书</option></select><label for="fontSize">正文字号</label><input id="fontSize" type="range" min="14" max="24"></details>
