<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开场白模板展架 · 九一工坊</title><style>*{box-sizing:border-box;scrollbar-width:none}*::-webkit-scrollbar{display:none}body{margin:0;background:#f3efe6;color:#493e3c;font:15px/1.8 'Microsoft YaHei',sans-serif}main{max-width:1040px;padding:50px 25px;margin:auto}header{border-bottom:1px solid #cfbdad;padding-bottom:24px}h1{font:36px KaiTi,serif;margin:14px 0}small{color:#967969;letter-spacing:.13em}p{color:#827267;font-size:13px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0}button,a.button{background:#784956;color:#fff8ed;padding:10px 17px;border:0;text-decoration:none;font:14px inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #784956;outline-offset:4px}a{color:#784956}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px}article{background:#fffbf2;border:1px solid #decebb;padding:24px;position:relative}article h2{font:25px KaiTi,serif;margin:15px 0}article .swatches{display:flex;height:65px;gap:6px}.swatches span{flex:1}article button{margin-top:10px}#notice{min-height:24px}details{margin-top:32px;border-top:1px solid #cfbdad;padding-top:18px}summary{cursor:pointer}input[type=file]{max-width:100%}.card-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card-actions button{margin:0}.secondary{background:transparent;color:#784956;border:1px solid #cfbdad;padding:9px 12px}.candidate{display:block;margin-top:15px;font-size:13px}article .swatches{height:12px}article p{min-height:42px}#count{font-size:15px;color:#493e3c}#notice:empty{display:none}</style></head><body><main><header><small>JIUYI ATELIER / OPENING LIBRARY</small><h1>把故事的开始，分享出去。</h1><p>挑选开场白外观，下载后导入工坊。模板只分享排版和配色，保留你自己的故事。</p></header><nav><a class="button" href="./opening-bloom-letter-preview.html">打开见花如晤</a><label>导入到本机展架 <input id="import" type="file" accept=".json,application/json"></label></nav><p id="count"></p><p id="notice" role="status"></p><section id="gallery" aria-label="模板展架"></section><details open><summary>发布我的模板</summary><p>在工坊点击“下载外观模板”，检查模板名称、作者和配色，再前往 GitHub 投稿并附上 JSON 文件。投稿审核合入仓库后，才会进入公共模板列表。本机展架只保存在当前浏览器。</p><a class="button" id="submit" target="_blank" rel="noopener">前往 GitHub 投稿 ↗</a></details></main><script type="module" src="./opening-template-gallery.js?v=0.11.41"></script></body></html>
