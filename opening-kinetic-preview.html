<header class="toolbar"><div><h1>动态开场实验</h1><small>时钟 / 信号 / 像素 · 九一</small></div><div><a href="./opening-kinetic-overview.html" style="color:inherit;font-size:12px;margin-right:16px">三款动态</a><button id="toggle-editor">展开编辑</button></div></header><nav class="theme-tabs" aria-label="选择开场白模板"><button data-theme="soft-clock"><span>01</span>此刻，开场<small>STORY CLOCK</small></button><button data-theme="signal-field"><span>02</span>未读频率<small>PIXEL RADIO</small></button><button data-theme="pixel-dusk"><span>03</span>下一站，像素<small>PIXEL DUSK</small></button></nav><div class="workspace"><aside id="editor" hidden><h2>作品设置</h2><p class="note">配图可留空。无图时采用完整的文字排版，不显示空框。</p><label for="title">作品名称</label><input id="title"><div class="row"><div><label for="subtitle">英文副标题</label><input id="subtitle"></div><div><label for="author">作者</label><input id="author"></div></div><div id="display-title-field" hidden><label for="displayTitle">顶部像素大字（可换行，留空隐藏）</label><textarea id="displayTitle" maxlength="80" rows="2"></textarea></div><label for="imageUrl">作品配图链接（可留空）</label><input id="imageUrl" type="url"><button type="button" id="upload-cover">选择作品配图</button><label for="intro">作品介绍</label><textarea id="intro"></textarea><button type="button" id="insert-intro">在简介光标处插图</button>
<details open><summary>开场白内容</summary><label for="entry">选择开场白</label><select id="entry"></select><label for="entry-title">标题</label><input id="entry-title"><label for="entry-summary">本篇简介</label><textarea id="entry-summary"></textarea><label for="entry-imageUrl">本条配图链接（可留空）</label><input id="entry-imageUrl" type="url" placeholder="https://…"><button type="button" id="upload-entry-cover">选择本条配图</button><label for="entry-body">开场白正文</label><textarea id="entry-body" rows="6"></textarea><button type="button" id="insert-body">在正文光标处插图</button><p class="note">可插入多张图片。光标放在想插图的段落，点击按钮选图；图片可随文字剪切、移动。</p><div class="row"><button id="add">添加开场白</button><button id="remove">移除本条</button></div><div class="row"><button id="up">向前移动</button><button id="read">预览本条</button></div></details>
<details><summary>字体、配色与字号</summary><div class="row"><div><label for="accent">点缀色</label><input type="color" id="accent"></div><div><label for="ink">文字主色</label><input type="color" id="ink"></div></div><label for="fontStyle">页面字体（标题与正文）</label><select id="fontStyle"><option value="serif">清雅宋体</option><option value="kai">温润楷体</option><option value="sans">清晰黑体</option><option value="fangsong">雅致仿宋</option><option value="rounded">柔和圆体</option><option value="clerical">古典隶书</option></select><label for="fontSize">正文字号</label><input id="fontSize" type="range" min="14" max="24"></details>
<button id="save" class="primary">保存本地草稿</button><div id="editor-status" role="status"></div><details><summary>模板分享与下载</summary><button id="export-template">下载工坊外观模板</button><label>导入可编辑配置<input id="import-draft" type="file" accept="application/json,.json"></label><a href="./opening-template-gallery.html" target="_blank" rel="noopener">打开模板展架 ↗</a><button id="export-draft">下载可编辑配置</button><button id="export-pages">下载开场白字段包</button><p class="note">字段包包含作品导航与全部额外开场白，每页已带返回按钮。用于后续接入角色卡；请保留原角色卡备份。</p></details><p class="note">本页为本地模拟。真实酒馆需启用酒馆助手；三款均已接入工坊外观和模板展架。示例故事可在这里修改。</p></aside>
